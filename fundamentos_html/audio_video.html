<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio y vídeo</title>
</head>
<body>
    <!-- Audio -->
     <audio controls>
        <source src="multimedia/audio1.mp3" type="audio/mpeg">
        Tu navegador no admite audio HTML5
     </audio>
    
    <!-- Video -->
     <video controls width="320" height="240">
        <source src="multimedia/video1.mp4" type="video/mp4" width="320" height="240"
        >
        Tu navegador no admite vídeo HTML5
     </video>


</body>
</html>
