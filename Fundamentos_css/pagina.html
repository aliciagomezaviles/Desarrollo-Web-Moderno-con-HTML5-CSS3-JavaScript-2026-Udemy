<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Estilo externo, opción recomendada -->
    <link rel="stylesheet" href="css/estilos.css">
    <title>Formas de implementar CSS</title>
    <!-- CSS interno -->
    <style>
        h2{
            color: brown; 
            font-size: 36px;
        }
        h3{
            color: yellow;
        }
    </style>
</head>
<body>
    <!-- CSS en línea, opción no recomendada -->
    <h1 style="color: blue; font-size: 48px;">Título 1</h1>
    <h2>Título 2</h2>
    <h3>Título 3</h3>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Dolorem reprehenderit minima quisquam harum. Modi illo vero, velit numquam nulla quo?</p>

    
</body>
</html>
