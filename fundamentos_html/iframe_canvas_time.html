<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe, canvas y time</title>
</head>
<body>
    <!-- Iframe -->
     <h2>Contenido embebido con Iframe</h2>
     <iframe src="https://render2web.com" width="400" height="250"></iframe>

    <!-- Canvas -->
     <canvas id="miCanvas" width="200" height="100" style="border: 2px black solid;"></canvas>

    <!-- Time -->
     <p>La fecha de mi cumpleaños es <time datetime="2025-07-21">21 de Julio de 2025</time></p>
     <p>La reunión está programada para las <time datetime="15:30">15:30</time></p>
     <p>El concierto durará <time datetime="PT2H30M">2 horas y 30 minutos</time></p>



</body>
</html>
