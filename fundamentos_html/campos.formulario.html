<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos formulario</title>
</head>
<body>
    <!-- Campos Formulario -->
     <form action="">
     <label for="nombre">Nombre:</label>
     <input type="text" placeholder="Ingrese aquí el nombre"> 
     <br>
     <br>

     <label for="contraseña">Contraseña:</label>
     <input type="password" placeholder="Ingrese aquí la contraseña"> 

     <br>
     <br>

     <label for="correo">Correo:</label>
     <input type="email" placeholder="Ingrese aquí el correo">

     <br>
     <br>

     <label for="cantidad">Cantidad:</label>
     <input type="number" placeholder="Ingrese aquí la cantidad">

     <br>
     <br>

     <label for="fecha">Fecha de nacimiento:</label>
     <input type="date" placeholder="Ingrese aquí la fecha de nacimiento">

     <br>
     <br>

     <label for="mayoredad">¿Eres mayor de edad?</label>
     <input type="radio" id="si" name="edad" value="si">
     <label for="si">Sí</label>
     <input type="radio" id="no" name="edad" value="no">
     <label for="no">No</label>

     <br>
     <br>

     <label>Selecciona tus intereses:</label>
     <input type="checkbox" id="deporte" name="intereses" value="deporte">
     <label for="deporte">Deporte</label>
     <input type="checkbox" id="musica" name="intereses" value="musica">
     <label for="musica">Música</label>
     <input type="checkbox" id="viajes" name="intereses" value="viajes">
     <label for="viajes">Viajes</label>

     <br>
     <br>

     <label for="comentarios">Comentarios:</label>
     <textarea name="comentarios" id="comentarios"></textarea>

     <br>
     <br>

     <label for="pais">País:</label>
     <select name="pais" id="pais">
        <option value="">--Selecciona un país--</option>
     <option value="usa">Estados Unidos</option>
     <option value="canada">Canadá</option>
     <option value="mexico">México</option>
     <option value="espana">España</option>
     </select>

     <br>
     <br>
     
     <label for="archivo">Cargar archivo:</label>
     <input type="file" id="archivo" name="archivo">

     <br>
     <br>

     <label for="color">Color Favorito</label>
     <input type="color" id="color" name="color">

     <br>
     <br>

     <label for="sitio-web">Sitio Web</label>
     <input type="url" id="sitio-web" name="sitio-web" placeholder="https://www.ejemplo.com">

     <br>
     <br>

     <label for="puntiacion">Puntuación</label>
     <input type="range" id="puntuacion" name="puntuacion" min="1" max="10">

     <br>
     <br>

     <input type="submit" value="Enviar">
     <input type="reset" value="Restablecer">



    




    </form>
</body>
</html>
