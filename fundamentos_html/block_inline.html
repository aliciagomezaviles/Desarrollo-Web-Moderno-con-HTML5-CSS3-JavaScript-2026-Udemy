<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos en bloque y en línea</title>
</head>
<body>
    <!-- block -->
    <h1>Título 1</h1>
    <h2>Subtítulo 1</h2>
    <p style="border: 4px blue solid;">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Commodi, non?</p>
    <p style="border: 4px red solid;">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Impedit, cupiditate obcaecati non illum nam tempore hic quos dolorem expedita ipsum.</p>
    
    <!-- inline -->
    <a href="#">LINK 1</a>
    <a href="#">LINK 2</a>
</body>
</html>
